[project]
name = "marley_demo_data"
authors = [{ name = "Kreatao", email = "kreataothinkcadd@gmail.com" }]
description = "Synthetic 50-patient demo dataset and loader for Marley Health v16.6.1"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
